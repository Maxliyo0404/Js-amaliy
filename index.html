<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masalalar</title>
</head>
<style>
    #cards{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
    }
    .card{
        width: 300px;
        height: 300px;
        background: red;
        text-align: center;
        border-radius: 30px;
    }
    h1{
        font-size: 30px;
        color: white;
    }
    p{
        font-size: 18px;
        color: white;
    }
</style>
<body>
      <h1>Javascript masalalari</h1>
      <div id="cards">
        <div class="card">
        <h1>Salom dunyo</h1>
        <p>Lorem ipsum dolor sit.</p>
      </div>
      </div>


    <script src="./style.js"></script>
</body>
</html>
